<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Background transparent -->

  <!-- ── Circular arc behind buildings ── -->
  <circle cx="160" cy="72" r="60" stroke="#1E40AF" stroke-width="3" fill="none"/>

  <!-- ── Buildings group (center) ── -->
  <!-- Left tall building -->
  <rect x="118" y="30" width="18" height="55" rx="2" fill="#1E40AF"/>
  <rect x="121" y="36" width="5" height="6" rx="1" fill="white" opacity="0.7"/>
  <rect x="129" y="36" width="5" height="6" rx="1" fill="white" opacity="0.7"/>
  <rect x="121" y="48" width="5" height="6" rx="1" fill="white" opacity="0.7"/>
  <rect x="129" y="48" width="5" height="6" rx="1" fill="white" opacity="0.7"/>

  <!-- Center tallest building -->
  <rect x="140" y="18" width="22" height="67" rx="2" fill="#1F2937"/>
  <rect x="143" y="25" width="5" height="7" rx="1" fill="white" opacity="0.6"/>
  <rect x="152" y="25" width="5" height="7" rx="1" fill="white" opacity="0.6"/>
  <rect x="143" y="38" width="5" height="7" rx="1" fill="white" opacity="0.6"/>
  <rect x="152" y="38" width="5" height="7" rx="1" fill="white" opacity="0.6"/>
  <rect x="143" y="51" width="5" height="7" rx="1" fill="white" opacity="0.6"/>
  <rect x="152" y="51" width="5" height="7" rx="1" fill="white" opacity="0.6"/>

  <!-- Right tall building -->
  <rect x="166" y="30" width="18" height="55" rx="2" fill="#1E40AF"/>
  <rect x="169" y="36" width="5" height="6" rx="1" fill="white" opacity="0.7"/>
  <rect x="177" y="36" width="5" height="6" rx="1" fill="white" opacity="0.7"/>
  <rect x="169" y="48" width="5" height="6" rx="1" fill="white" opacity="0.7"/>
  <rect x="177" y="48" width="5" height="6" rx="1" fill="white" opacity="0.7"/>

  <!-- ── House roof shape beneath buildings ── -->
  <polygon points="140,85 160,65 180,85" fill="#1F2937"/>
  <rect x="152" y="76" width="16" height="9" rx="1" fill="white" opacity="0.5"/>

  <!-- ── Horizontal rule ── -->
  <line x1="50" y1="100" x2="270" y2="100" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ── Arabic company name ── -->
  <text x="160" y="122" text-anchor="middle" font-family="Cairo, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#1F2937" letter-spacing="1">
    سوق العقارات
  </text>

  <!-- ── Subtitle ── -->
  <text x="160" y="142" text-anchor="middle" font-family="Cairo, Arial, sans-serif"
        font-size="10" font-weight="400" fill="#4b5563">
    جريدة إعلانية متخصصة في تسويق العقارات
  </text>

  <!-- ── Four icon badges at bottom ── -->
  <!-- Badge 1: handshake / trust -->
  <g transform="translate(55,155)">
    <circle cx="0" cy="0" r="10" fill="#F97316" opacity="0.12"/>
    <text x="0" y="4" text-anchor="middle" font-size="10">🤝</text>
    <text x="0" y="16" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="6" fill="#4b5563">ثقة ومصداقية</text>
  </g>
  <!-- Badge 2: location -->
  <g transform="translate(110,155)">
    <circle cx="0" cy="0" r="10" fill="#1E40AF" opacity="0.12"/>
    <text x="0" y="4" text-anchor="middle" font-size="10">📍</text>
    <text x="0" y="16" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="6" fill="#4b5563">أفضل المواقع</text>
  </g>
  <!-- Badge 3: for rent -->
  <g transform="translate(210,155)">
    <circle cx="0" cy="0" r="10" fill="#1E40AF" opacity="0.12"/>
    <text x="0" y="4" text-anchor="middle" font-size="10">🏠</text>
    <text x="0" y="16" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="6" fill="#4b5563">عقارات للإيجار</text>
  </g>
  <!-- Badge 4: for sale -->
  <g transform="translate(265,155)">
    <circle cx="0" cy="0" r="10" fill="#F97316" opacity="0.12"/>
    <text x="0" y="4" text-anchor="middle" font-size="10">🏢</text>
    <text x="0" y="16" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="6" fill="#4b5563">عقارات للبيع</text>
  </g>
</svg>
